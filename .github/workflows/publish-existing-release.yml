name: Publish existing macOS artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the verified architecture artifacts
        required: true
        type: string
      release_tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: mirage-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release and update feeds
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Download verified packages
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Validate source and packages
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse HEAD)"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          [[ "$source_sha" == "$tag_sha" ]] || {
            echo "::error::Artifact run $SOURCE_RUN_ID belongs to $source_sha, not $tag_sha."
            exit 1
          }

          build_number="$(git rev-list --count "$tag_sha")"
          short_commit="${tag_sha:0:12}"
          [[ "$(find artifacts -type f -name '*.zip' | wc -l | tr -d ' ')" == 2 ]]
          [[ "$(find artifacts -type f -name '*.zip.sha256' | wc -l | tr -d ' ')" == 2 ]]

          for arch in x86_64 arm64; do
            expected_name="Mirage-${build_number}-${short_commit}-macOS-${arch}.zip"
            archive="$(find artifacts -type f -name "$expected_name" -print -quit)"
            test -n "$archive"
            checksum="$archive.sha256"
            test -f "$checksum"
            expected_sha="$(awk 'NR == 1 { print $1 }' "$checksum")"
            actual_sha="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
            [[ "$actual_sha" == "$expected_sha" ]] || {
              echo "::error::SHA-256 mismatch for $expected_name."
              exit 1
            }
          done

          test -f ".github/release-notes/${RELEASE_TAG}.md"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Resolve Sparkle publishing tools
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -project 'Mirage/Mirage Wallpaper.xcodeproj' \
            -scheme 'Mirage Wallpaper' \
            -derivedDataPath Mirage/build/DD

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIRAGE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo '::error::Repository secret MIRAGE_RELEASE_TOKEN is missing.'
            exit 1
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release-assets/ \;
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.release.outputs.tag_sha }}" \
            --title "Mirage $RELEASE_TAG" \
            --notes-file ".github/release-notes/${RELEASE_TAG}.md"

      - name: Ensure update-feed branch exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/update-feeds" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/heads/update-feeds' \
              -f sha='${{ steps.release.outputs.tag_sha }}'
          fi

      - name: Check out update feeds
        uses: actions/checkout@v6
        with:
          ref: update-feeds
          path: update-feeds
          fetch-depth: 1

      - name: Generate signed architecture appcasts
        shell: bash
        env:
          MIRAGE_SPARKLE_PRIVATE_KEY: ${{ secrets.MIRAGE_SPARKLE_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ -n "$MIRAGE_SPARKLE_PRIVATE_KEY" ]] || {
            echo '::error::Repository secret MIRAGE_SPARKLE_PRIVATE_KEY is missing.'
            exit 1
          }
          tool='Mirage/build/DD/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast'
          test -x "$tool"

          for arch in x86_64 arm64; do
            archive="$(find artifacts -type f -name "*macOS-${arch}.zip" -print -quit)"
            test -n "$archive"
            appcast_dir="$RUNNER_TEMP/appcast-${arch}"
            mkdir -p "$appcast_dir"
            cp "$archive" "$appcast_dir/"
            if [[ -f "update-feeds/appcast-${arch}.xml" ]]; then
              cp "update-feeds/appcast-${arch}.xml" "$appcast_dir/appcast-${arch}.xml"
            fi
            archive_name="$(basename "$archive" .zip)"
            sed \
              -e '/^<details>$/d' \
              -e '/^<summary>.*<\/summary>$/d' \
              -e '/^<\/details>$/d' \
              ".github/release-notes/${RELEASE_TAG}.md" > "$appcast_dir/${archive_name}.md"

            printf '%s' "$MIRAGE_SPARKLE_PRIVATE_KEY" | "$tool" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              --embed-release-notes \
              --versions "$BUILD_NUMBER" \
              --maximum-versions 6 \
              --maximum-deltas 0 \
              "$appcast_dir"
            cp "$appcast_dir/appcast-${arch}.xml" "update-feeds/appcast-${arch}.xml"
          done

      - name: Upload signed appcasts
        uses: actions/upload-artifact@v7
        with:
          name: signed-appcasts-${{ inputs.release_tag }}
          path: |
            update-feeds/appcast-x86_64.xml
            update-feeds/appcast-arm64.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish update feeds
        shell: bash
        run: |
          set -euo pipefail
          git -C update-feeds config user.name 'github-actions[bot]'
          git -C update-feeds config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C update-feeds add appcast-x86_64.xml appcast-arm64.xml
          git -C update-feeds diff --cached --quiet && {
            echo '::error::Generated appcasts did not change.'
            exit 1
          }
          git -C update-feeds commit -m "chore(update): publish stable ${{ steps.release.outputs.tag_sha }}"
          git -C update-feeds push origin HEAD:update-feeds
